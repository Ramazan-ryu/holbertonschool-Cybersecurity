[Interface]
Address = 10.200.0.1/24      # VPN IP of the server
ListenPort = 51820           # Port WireGuard listens on
PrivateKey = <server_private_key>   # Put server_private content here

[Peer]
PublicKey = <client_public_key>     # Put client_public content here
AllowedIPs = 10.200.0.2/32         # VPN IP allowed for this client
