# =========================
# Full Squid Configuration: SSL/TLS interception + VPN/SSH + ACLs
# =========================

# Define ACLs
acl localnet src 10.200.0.0/24                # VPN subnet
acl ssh_access dst 127.0.0.1/32 tcp port 22
acl blocked_extensions urlpath_regex -i \\.(exe|bat|ps1|msi|scr)$
acl localhost src 127.0.0.1/32

# SSL/TLS interception
https_port 3129 intercept ssl-bump \
    cert=/etc/squid/ssl_cert/squidCA.pem \
    generate-host-certificates=on dynamic_cert_mem_cache_size=4MB

# SSL Bump rules
acl step1 at_step SslBump1
ssl_bump peek step1
ssl_bump bump all

# HTTP Access Rules
http_access allow localhost
http_access allow localnet
http_access allow ssh_access

# Deny dangerous file types
http_access deny blocked_extensions

# Deny everything else by default
http_access deny all

# Standard HTTP proxy port
http_port 3128

# Logging
access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log

# Performance & caching options (optional)
cache_mem 256 MB
maximum_object_size_in_memory 8 MB
maximum_object_size 128 MB
