playbook_id: PB-CRED-001
title: Credential Exposure Response Playbook
owner_role: James Chen - SOC Lead / IR Commander

applies_to:
  - Active Directory accounts
  - Azure AD accounts
  - Epic Hyperspace access
  - VPN access
  - Microsoft 365 accounts
  - MedDefense clinical and non-clinical workforce

severity_mapping:
  low:
    - User entered credentials into phishing page
    - No confirmed unauthorized login
  medium:
    - Confirmed suspicious Azure AD login
    - MFA abuse attempts detected
  high:
    - Successful foreign login confirmed
    - VPN or Epic access observed
    - Mailbox access confirmed
  critical:
    - Confirmed ePHI access
    - Mass mailbox access
    - Lateral movement or privilege escalation detected

immediate_actions:
  - Open incident ticket in IR tracking system
  - Assign James Chen as Incident Commander
  - Identify affected user account and associated systems
  - Validate suspicious authentication activity in Splunk
  - Determine whether unauthorized access is active
  - Notify Robert Kim for account containment support
  - Notify Helena Reyes if ePHI exposure is suspected

evidence_preservation:
  - Preserve authentication logs from Splunk Enterprise
  - Export Azure AD sign-in log data for affected account
  - Export affected mailbox audit records
  - Export recent data access audit logs from Epic
  - Export VPN authentication records
  - Record source IP addresses and geolocation information
  - Preserve phishing email headers and URLs if available
  - Document timestamps of attacker activity
  - Preserve evidence before password reset or token revocation

decision_point:
  description: >
    Decide whether to immediately revoke attacker access or briefly
    monitor attacker activity for additional intelligence collection.
  immediate_reset_risk:
    - Loss of attacker visibility
    - Loss of additional indicators of compromise
  delayed_monitoring_risk:
    - Additional unauthorized access
    - Increased ePHI exposure risk
    - Additional persistence opportunities for attacker
  approval_authority:
    - James Chen
    - Dr. Patricia Morales for critical incidents

containment_actions:
  - Reset affected Active Directory password immediately
  - Revoke all Azure AD active sessions
  - Reset Azure MFA registration for affected user
  - Revoke active VPN tokens and VPN sessions
  - Terminate active Epic Hyperspace sessions
  - Force Microsoft 365 logout across all devices
  - Disable mailbox forwarding rules if identified
  - Block malicious IP addresses at firewall if applicable
  - Isolate affected workstation if malware delivery is suspected

eradication_actions:
  - Remove phishing emails from affected mailboxes
  - Scan affected endpoints using Wazuh EDR
  - Validate Microsoft Defender alerts on affected devices
  - Remove unauthorized Azure AD applications or OAuth grants
  - Remove persistence mechanisms identified during investigation
  - Reset credentials for any additional impacted accounts
  - Verify no unauthorized administrative accounts were created

recovery_validation:
  - Confirm successful password reset
  - Confirm Azure AD session revocation completed
  - Confirm MFA device reset and re-registration completed
  - Confirm VPN access restoration for legitimate user
  - Confirm Epic access restored successfully
  - Monitor affected account activity for 72 hours
  - Confirm no additional foreign login attempts detected
  - Document recovery completion in incident record

communication_plan:
  internal:
    - Notify SOC analysts and on-call responders
    - Notify Sarah Park and Robert Kim during containment
    - Notify Helena Reyes if HIPAA assessment required
    - Notify Marcus Webb if public communication becomes necessary
  external:
    - Engage external DFIR retainer if compromise expands
    - Coordinate all breach notifications through Legal
    - Do not notify patients without Legal approval

escalation_triggers:
  - Confirmed ePHI access during exposure window
  - Multiple accounts compromised
  - Privileged account compromise
  - Lateral movement activity detected
  - Persistence mechanisms identified
  - Epic patient record access confirmed
  - Large mailbox export activity detected

post_incident_tasks:
  - Conduct HIPAA breach assessment
  - Determine whether ePHI was accessible during compromise window
  - Review Epic audit logs for patient data access
  - Document incident timeline and response actions
  - Update Splunk detection logic using identified indicators
  - Deliver phishing awareness guidance to affected department
  - Conduct lessons learned meeting within 5 business days
  - Store final incident report in MedDefense IR repository
