title: Suspicious Windows Service Masquerading Process (Cobalt Strike Beacon Pattern)
id: 9f3b2c2a-7d5e-4c91-a1b3-7c9c2f3d8a11
status: experimental
description: Detects execution of suspicious service-like binaries (e.g., svchost32.exe, lsass32.exe) from non-standard paths spawned by scripting engines such as powershell.exe or wscript.exe. Observed in Cobalt Strike beacon activity during incident IR-2026-0420-01.
author: IR Team
date: 2026-04-21
level: high

references:
  - IR-2026-0420-01
  - https://attack.mitre.org/tactics/TA0002/

logsource:
  category: process_creation
  product: windows

detection:
  selection_parent:
    ParentImage|endswith:
      - '\powershell.exe'
      - '\wscript.exe'

  selection_child_name:
    Image|contains:
      - 'svchost32.exe'
      - 'lsass32.exe'
      - 'csrss32.exe'

  selection_child_path:
    Image|contains:
      - '\AppData\'
      - '\Temp\'
      - '\ProgramData\'

  condition: selection_parent and selection_child_name and selection_child_path

falsepositives:
  - Third-party IT administration tools using renamed binaries
  - Legacy internal service wrappers using non-standard service naming

tags:
  - attack.execution
  - attack.t1059
  - attack.defense_evasion
  - cobalt_strike

level: high
