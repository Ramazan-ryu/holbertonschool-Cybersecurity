title: Persistence via Scheduled Task Creation
id: c4a3d005-7711-48ba-aa31-40de7dd9e1a5
status: experimental
description: |
  Detects creation of scheduled tasks using Windows Security Event ID 4698 or Sysmon Event ID 1 
  where the schtasks.exe command utility is executed with creation arguments. 
  Excludes baseline tasks generated by the SYSTEM account or Windows Defender automation.
author: MedDefense SOC Detection Engineering
date: 2026/06/07
logsource:
    product: windows
    service: security
detection:
    selection_security_log:
        EventID: 4698
    selection_sysmon_log:
        EventID: 1
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: '/create'
    filter_legitimate_accounts:
        SubjectUserName: 'SYSTEM'
    filter_defender:
        CommandLine|contains: 'Windows Defender'
    condition: (selection_security_log or selection_sysmon_log) and not (filter_legitimate_accounts or filter_defender)
falsepositives:
    - Standard software installers creating periodic upgrade checkers during initial environment deployments.
    - Authorized legacy MedDefense backup automation scripts or diagnostic collection tasks provisioned by IT administration.
level: high
tags:
    - attack.persistence
    - attack.t1053.005
