title: Multi-Source Credential Theft and Privilege Escalation Chain
id: b3a2d010-4411-4afb-aa99-50ff9eeae1c7
status: experimental
description: |
  Detects a multi-source credential compromise chain consisting of three distinct phases:
  Phase 1: Three or more authentication failures for the same user from source IP A within 300 seconds (Brute Force / Credential Stuffing).
  Phase 2: A subsequent successful authentication for the same user from source IP B (different from A) within 300 seconds indicating a separate compromised vector or geographic/network shift.
  Phase 3: Any privilege_escalation canonical activity executed on the destination host within 600 seconds of the login.
  Maps to ATT&CK tactics Credential Access (T1110), Initial Access / Persistence via Valid Accounts (T1078), and Privilege Escalation.
author: MedDefense SOC Detection Engineering
date: 2026/06/07
logsource:
    category: correlation
    product: windows
detection:
    selection_primitive:
        correlation_primitive: 'credential_compromise_chain'
    condition: selection_primitive
falsepositives:
    - Highly complex automated penetration testing platform simulation scenarios or dual-homed administrator configuration sync scripts traversing multiple subnets.
level: critical
tags:
    - attack.credential_access
    - attack.t1110
    - attack.t1078
