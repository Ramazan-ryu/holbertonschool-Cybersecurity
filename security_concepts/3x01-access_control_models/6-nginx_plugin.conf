# 6-nginx_plugin.conf - Updated AppArmor profile for nginx with SecureHealth plugin access

/usr/sbin/nginx {
    # Existing rules
    /etc/nginx/** r,
    /var/log/nginx/* w,
    /usr/share/nginx/html/** r,

    # New rules for SecureHealth plugin
    /opt/securehealth/plugin.conf r,
    /opt/securehealth/data/** r,}
